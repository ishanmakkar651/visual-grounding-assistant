
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionEngine Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; }

        /* Layout */
        .sidebar-left { width: 16rem; flex-shrink: 0; }
        .sidebar-right { width: 28rem; flex-shrink: 0; }
        .main-area { flex: 1; position: relative; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; }

        #canvasContainer { overflow: auto; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { box-shadow: 0 20px 50px rgba(0,0,0,0.5); cursor: crosshair; }

        /* Mic Animation */
        .mic-active { animation: pulseRed 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Report Mode (Hidden usually) */
        .report-only { display: none; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <div class="sidebar-left bg-slate-900 border-r border-slate-700 flex flex-col hidden md:flex z-20 shadow-xl">
        <div class="p-5 border-b border-slate-700">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                <i class="fas fa-brain mr-2 text-blue-400"></i>VisionEngine
            </h1>
            <p class="text-xs text-slate-500 mt-1">v4.0 Ultimate</p>
        </div>

        <div class="p-4 space-y-3">
            <input type="file" id="fileInput" class="hidden" accept=".pdf,image/*">
            <button onclick="document.getElementById('fileInput').click()"
                class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 px-4 rounded-lg flex items-center justify-center border border-slate-700 transition">
                <i class="fas fa-folder-open mr-2"></i> Import File
            </button>

            <button onclick="generateReport()"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-4 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/20 transition">
                <i class="fas fa-file-pdf mr-2"></i> Export Report
            </button>
        </div>

        <div class="px-5 pb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Pages</div>
        <div class="flex-1 overflow-y-auto p-3 space-y-2" id="pageList">
            <div class="text-slate-600 text-sm text-center mt-10 opacity-50">No file loaded</div>
        </div>
    </div>

    <div class="main-area relative group">
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur border border-slate-600 rounded-full px-4 py-2 flex space-x-4 shadow-2xl z-10">
            <button onclick="setTool('box')" id="btnBox" class="text-blue-400 hover:text-white" title="Analyze Region"><i class="fas fa-vector-square"></i></button>
            <button onclick="setTool('table')" id="btnTable" class="text-slate-400 hover:text-emerald-400" title="Extract Table to CSV"><i class="fas fa-table"></i></button>
            <div class="w-px bg-slate-600 h-5 my-auto"></div>
            <button onclick="zoom(0.1)" class="text-slate-300"><i class="fas fa-search-plus"></i></button>
            <button onclick="resetZoom()" class="text-slate-300 text-xs font-mono">100%</button>
            <button onclick="zoom(-0.1)" class="text-slate-300"><i class="fas fa-search-minus"></i></button>
        </div>

        <div id="canvasContainer">
            <div id="placeholder" class="text-slate-600 text-center">
                <i class="fas fa-cloud-upload-alt text-7xl mb-4 opacity-20"></i>
                <p class="text-lg">Drag & Drop Schematic / PDF</p>
            </div>
            <canvas id="mainCanvas" class="hidden rounded"></canvas>
        </div>

        <div class="absolute bottom-2 left-4 text-xs font-mono text-slate-500" id="coords">X:0 Y:0</div>
    </div>

    <div class="sidebar-right bg-slate-800 border-l border-slate-700 flex flex-col z-20 shadow-2xl">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
            <span class="font-semibold text-slate-200"><i class="fas fa-comments mr-2 text-blue-400"></i>AI Analysis</span>
            <div class="flex space-x-2">
                 <button onclick="toggleVoice()" id="btnVoice" class="text-slate-400 hover:text-white" title="Text-to-Speech"><i class="fas fa-volume-up"></i></button>
                 <button onclick="clearChat()" class="text-slate-400 hover:text-red-400"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>

        <div id="chatHistory" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-slate-700 p-4 rounded-xl text-sm text-slate-300 border border-slate-600">
                🤖 <b>System Ready.</b> <br>
                1. Select <b>Box Tool</b> to analyze components.<br>
                2. Select <b>Table Tool</b> to extract data to CSV.<br>
                3. Click <b>Mic</b> to speak.
            </div>
        </div>

        <div class="p-4 bg-slate-900 border-t border-slate-700">
            <div class="flex items-center gap-2">
                <button id="micBtn" onclick="toggleMic()" class="p-3 rounded-full bg-slate-700 text-slate-300 hover:bg-slate-600 transition shadow-lg">
                    <i class="fas fa-microphone"></i>
                </button>
                <div class="relative flex-1">
                    <input type="text" id="chatInput" placeholder="Type or Speak..."
                        class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg pl-4 pr-10 py-3 focus:border-blue-500 focus:outline-none text-sm">
                    <button onclick="sendTextChat()" class="absolute right-2 top-2 text-blue-500 p-2 hover:text-white"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- STATE & VARS ---
        let currentSession = null, currentPageUrl = null;
        let imgObj = new Image();
        let scale = 1.0;
        let isDrawing = false, startX = 0, startY = 0;
        let currentTool = 'box'; // 'box' or 'table'
        let lastBox = null;
        let voiceEnabled = true;

        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const chatContainer = document.getElementById('chatHistory');
        const fileInput = document.getElementById('fileInput');

        // --- 1. UPLOAD ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('pageList').innerHTML = '<div class="text-center mt-10 text-blue-400"><i class="fas fa-circle-notch fa-spin"></i> Processing...</div>';
            const fd = new FormData(); fd.append('file', file);
            try {
                const res = await axios.post('/upload', fd);
                currentSession = res.data.session_id;
                renderPages(res.data.pages);
                loadPage(res.data.pages[0]);
            } catch (err) { alert("Upload failed"); }
        });

        function renderPages(pages) {
            const list = document.getElementById('pageList'); list.innerHTML = '';
            pages.forEach((url, i) => {
                const el = document.createElement('div');
                el.className = 'p-2 bg-slate-800 rounded cursor-pointer mb-2 hover:bg-slate-700 text-sm text-slate-300 flex items-center gap-2';
                el.innerHTML = `<i class="fas fa-file-image"></i> Page ${i+1}`;
                el.onclick = () => loadPage(url);
                list.appendChild(el);
            });
        }

        function loadPage(url) {
            currentPageUrl = url;
            imgObj.src = url;
            imgObj.onload = () => {
                document.getElementById('placeholder').classList.add('hidden');
                canvas.classList.remove('hidden');
                resetZoom();
            };
        }

        // --- 2. DRAWING & TOOLS ---
        function setTool(tool) {
            currentTool = tool;
            document.getElementById('btnBox').className = tool==='box' ? 'text-blue-400' : 'text-slate-400 hover:text-white';
            document.getElementById('btnTable').className = tool==='table' ? 'text-emerald-400' : 'text-slate-400 hover:text-white';
        }

        function render() {
            canvas.width = imgObj.width * scale; canvas.height = imgObj.height * scale;
            ctx.drawImage(imgObj, 0, 0, canvas.width, canvas.height);
            if (lastBox) {
                const {x1, y1, x2, y2} = lastBox;
                ctx.strokeStyle = currentTool === 'table' ? '#10b981' : '#ef4444';
                ctx.lineWidth = 3;
                ctx.strokeRect(x1*scale, y1*scale, (x2-x1)*scale, (y2-y1)*scale);
            }
        }

        canvas.addEventListener('mousedown', e => { isDrawing=true; const p=getPos(e); startX=p.x; startY=p.y; lastBox=null; });
        canvas.addEventListener('mousemove', e => {
            const p = getPos(e);
            document.getElementById('coords').innerText = `X:${Math.round(p.x)} Y:${Math.round(p.y)}`;
            if (!isDrawing) return;
            render();
            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
            ctx.strokeRect(startX*scale, startY*scale, (p.x-startX)*scale, (p.y-startY)*scale);
            ctx.setLineDash([]);
        });
        canvas.addEventListener('mouseup', e => {
            if (!isDrawing) return; isDrawing=false;
            const p = getPos(e);
            lastBox = { x1:Math.min(startX,p.x), y1:Math.min(startY,p.y), x2:Math.max(startX,p.x), y2:Math.max(startY,p.y) };

            // Trigger AI based on Tool
            if (currentTool === 'table') {
                sendToAI("Extract this table data into CSV format. Return ONLY the CSV data.", lastBox);
            } else {
                if (lastBox.x2 - lastBox.x1 < 10) sendToAI("Identify this component.", lastBox);
                else sendToAI("Analyze this specific region.", lastBox);
            }
            render();
        });

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const sx = canvas.width/r.width; const sy = canvas.height/r.height;
            return { x: ((e.clientX-r.left)*sx)/scale, y: ((e.clientY-r.top)*sy)/scale };
        }

        // --- 3. CHAT & VOICE ---
        async function sendToAI(msg, box=null) {
            if (!currentSession) return;
            const lid = addMsg('system', '<i class="fas fa-spinner fa-spin"></i> Processing...');
            const fd = new FormData();
            fd.append('session_id', currentSession); fd.append('image_url', currentPageUrl); fd.append('message', msg);
            if (box) { fd.append('x1',Math.round(box.x1)); fd.append('y1',Math.round(box.y1)); fd.append('x2',Math.round(box.x2)); fd.append('y2',Math.round(box.y2)); }

            try {
                const res = await axios.post('/chat', fd);
                document.getElementById(lid).remove();
                addMsg('ai', res.data.content);
                if (voiceEnabled) speak(res.data.content);
                if (res.data.bbox) drawGreenBox(res.data.bbox);
            } catch { document.getElementById(lid).innerHTML = "Error"; }
        }

        function addMsg(role, html) {
            const id = Math.random().toString(36);
            const div = document.createElement('div'); div.id=id;
            div.className = `p-4 rounded-xl text-sm mb-3 border border-slate-600 ${role==='user'?'bg-blue-600 ml-10 text-white':'bg-slate-700 mr-10 text-slate-200'}`;
            div.innerHTML = html;
            chatContainer.appendChild(div); chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function sendTextChat() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            addMsg('user', txt); sendToAI(txt, lastBox);
            document.getElementById('chatInput').value = '';
        }

        // Mic Logic
        function toggleMic() {
            const btn = document.getElementById('micBtn');
            if (btn.classList.contains('mic-active')) {
                recognition.stop();
                btn.classList.remove('mic-active');
            } else {
                recognition.start();
                btn.classList.add('mic-active');
            }
        }
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            addMsg('user', transcript);
            sendToAI(transcript, lastBox);
            document.getElementById('micBtn').classList.remove('mic-active');
        };

        // TTS Logic
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Strip Markdown/HTML for speech
                const cleanText = text.replace(/<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.speechSynthesis.speak(utterance);
            }
        }
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('btnVoice');
            btn.className = voiceEnabled ? "text-blue-400" : "text-slate-600 line-through";
        }

        // --- 4. EXPORT REPORT ---
        function generateReport() {
            const el = document.getElementById('chatHistory');
            // Hacky pdf gen
            const opt = { margin: 10, filename: 'Analysis_Report.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(el).save();
        }

        // --- HELPERS ---
        function drawGreenBox(str) {
            const m = str.match(/\((\d+),(\d+)\),\((\d+),(\d+)\)/);
            if(!m) return;
            const w = imgObj.width, h=imgObj.height;
            const x1=(m[2]/1000)*w, y1=(m[1]/1000)*h, x2=(m[4]/1000)*w, y2=(m[3]/1000)*h;
            ctx.strokeStyle='#22c55e'; ctx.lineWidth=4; ctx.strokeRect(x1*scale,y1*scale,(x2-x1)*scale,(y2-y1)*scale);
        }
        function zoom(d) { scale = Math.max(0.2, Math.min(5, scale+d)); render(); }
        function resetZoom() { scale = document.getElementById('canvasContainer').clientWidth/imgObj.width; render(); }
    </script>
</body>
</html>
